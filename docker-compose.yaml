services:
  tor: &svc
    container_name: tor
    image: blesk/tor
    pull_policy: never
    build:
      context: ./tor
      args:
        BLESK_TOR_VERSION:
        BLESK_TOR_USERNAME:
        BLESK_TOR_UID:
        BLESK_TOR_GID:
        BLESK_TOR_HOME:
        BLESK_TOR_ONIONS:
        BLESK_TOR_PORT_SOCKS:
        BLESK_TOR_PORT_CONTROL:
    restart: always
    stop_grace_period: 1m
    logging: &logging
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    env_file:
      - ./.env
    volumes:
      - data-tor:${BLESK_TOR_HOME}
    networks:
      internal:
        ipv6_address: ${BLESK_TOR_IPV6}
      external:
  bitcoincore:
    <<: *svc
    container_name: bitcoincore
    image: blesk/bitcoincore
    build:
      context: ./bitcoincore
      args:
        BLESK_BITCOINCORE_VERSION:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_UID:
        BLESK_BITCOINCORE_GID:
        BLESK_BITCOINCORE_HOME:
        BLESK_BITCOINCORE_PORT_RPC:
        BLESK_BITCOINCORE_PORT_P2P:
        BLESK_BITCOINCORE_PORT_ZMQ_BLOCK:
        BLESK_BITCOINCORE_PORT_ZMQ_TX:
        BLESK_TOR_USERNAME:
        BLESK_TOR_GID:
    volumes:
      - data-bitcoincore:${BLESK_BITCOINCORE_HOME}/.bitcoin
      - data-tor:${BLESK_TOR_HOME}:ro
    networks:
      internal:
        ipv6_address: ${BLESK_BITCOINCORE_IPV6}
    depends_on:
      - tor
  electrs:
    <<: *svc
    container_name: electrs
    image: blesk/electrs
    build:
      context: ./electrs
      args:
        BLESK_ELECTRS_VERSION:
        BLESK_ELECTRS_USERNAME:
        BLESK_ELECTRS_UID:
        BLESK_ELECTRS_GID:
        BLESK_ELECTRS_HOME:
        BLESK_ELECTRS_PORT:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_GID:
    volumes:
      - data-electrs:${BLESK_ELECTRS_HOME}
      - data-bitcoincore:${BLESK_ELECTRS_HOME}/.bitcoin:ro
    networks:
      internal:
        ipv6_address: ${BLESK_ELECTRS_IPV6}
    depends_on:
      - bitcoincore
  explorer:
    <<: *svc
    container_name: explorer
    image: blesk/explorer
    build:
      context: ./explorer
      args:
        BLESK_EXPLORER_VERSION:
        BLESK_EXPLORER_CHECKSUM:
        BLESK_EXPLORER_USERNAME:
        BLESK_EXPLORER_UID:
        BLESK_EXPLORER_GID:
        BLESK_EXPLORER_HOME:
        BLESK_EXPLORER_PORT:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_GID:
    volumes:
      - data-bitcoincore:${BLESK_EXPLORER_HOME}/.bitcoin:ro
    networks:
      internal:
        ipv6_address: ${BLESK_EXPLORER_IPV6}
    depends_on:
      - bitcoincore
      - electrs
  mariadb:
    <<: *svc
    container_name: mariadb
    image: blesk/mariadb
    build:
      context: ./mariadb
      args:
        BLESK_DOJO_VERSION:
        BLESK_MARIADB_SCRIPTS_CHECKSUM_1:
        BLESK_MARIADB_SCRIPTS_CHECKSUM_2:
        BLESK_MARIADB_VERSION:
    volumes:
      - data-mariadb:/var/lib/mysql
    networks:
      internal:
        ipv6_address: ${BLESK_MARIADB_IPV6}
  dojo:
    <<: *svc
    container_name: dojo
    image: blesk/dojo
    build:
      context: ./dojo
      args:
        BLESK_DOJO_VERSION:
        BLESK_DOJO_USERNAME:
        BLESK_DOJO_UID:
        BLESK_DOJO_GID:
        BLESK_DOJO_HOME:
        BLESK_DOJO_PORT_API:
        BLESK_DOJO_PORT_PUSHTX:
        BLESK_DOJO_PORT_TRACKER:
        BLESK_TOR_USERNAME:
        BLESK_TOR_GID:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_GID:
    volumes:
      - data-tor:${BLESK_TOR_HOME}:ro
      - data-bitcoincore:${BLESK_DOJO_HOME}/.bitcoin:ro
    networks:
      internal:
        ipv6_address: ${BLESK_DOJO_IPV6}
    depends_on:
      - tor
      - bitcoincore
      - electrs
      - mariadb
  nginx:
    container_name: nginx
    image: blesk/nginx
    pull_policy: never
    build:
      context: ./nginx
      args:
        NGINX_ENVSUBST_OUTPUT_DIR:
    restart: always
    stop_grace_period: 1m
    logging: *logging
    env_file:
      - ./.env
    networks:
      internal:
        ipv6_address: ${BLESK_NGINX_IPV6}
  lnd:
    container_name: lnd
    image: blesk/lnd
    pull_policy: never
    build:
      context: ./lnd
      args:
        BLESK_LND_VERSION:
        BLESK_LND_SIGNATURES:
        BLESK_LND_USERNAME:
        BLESK_LND_UID:
        BLESK_LND_GID:
        BLESK_LND_HOME:
        BLESK_LND_PORT_P2P:
        BLESK_LND_PORT_RPC:
        BLESK_LND_PORT_REST:
        BLESK_LND_SCB_BACKUP_DIR:
        BLESK_LNDINIT_VERSION:
        BLESK_LNDCONNECT_VERSION:
        BLESK_LNDCONNECT_CHECKSUM:
        BLESK_TOR_USERNAME:
        BLESK_TOR_GID:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_GID:
    restart: always
    stop_grace_period: 1m
    logging: *logging
    env_file:
      - ./.env
    volumes:
      - data-lnd:${BLESK_LND_HOME}/.lnd
      - data-tor:${BLESK_TOR_HOME}:ro
      - data-bitcoincore:${BLESK_LND_HOME}/.bitcoin:ro
      - ${BLESK_LND_SCB_BACKUP_DIR}:${BLESK_LND_SCB_BACKUP_DIR}
    networks:
      internal:
        ipv6_address: ${BLESK_LND_IPV6}
    depends_on:
      - tor
      - bitcoincore

volumes:
  data-tor:
  data-bitcoincore:
  data-electrs:
  data-mariadb:
  data-lnd:

networks:
  external:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "true"
      com.docker.network.enable_ipv4: "false"
  internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.enable_ipv6: "true"
      com.docker.network.enable_ipv4: "false"
    ipam:
      driver: default
      config:
        - subnet: ${BLESK_NET_INTERNAL_IPV6}
