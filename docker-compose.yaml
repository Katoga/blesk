services:
  _svc: &svc
    container_name: svc
    image: blesk/svc
    pull_policy: never
    build:
      context: _svc
    read_only: true
    restart: always
    stop_grace_period: 1m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
    env_file:
      - ./.env
    networks:
      internal:
  tor:
    <<: *svc
    container_name: tor
    image: blesk/tor
    build:
      context: ./tor
      args:
        BLESK_TOR_VERSION:
        BLESK_TOR_COOKIE_DIR:
        BLESK_TOR_PORT_SOCKS:
        BLESK_TOR_PORT_CONTROL:
    command:
      - --SocksPort
      - >-
        [${BLESK_TOR_IPV6}]:${BLESK_TOR_PORT_SOCKS} OnionTrafficOnly ExtendedErrors
      - --SocksPolicy
      - accept6 ${BLESK_NET_INTERNAL_IPV6}
      - --DataDirectory
      - /home/nonroot/.tor
      - --ControlPort
      - >-
        [${BLESK_TOR_IPV6}]:${BLESK_TOR_PORT_CONTROL}
      - --CookieAuthFile
      - ${BLESK_TOR_COOKIE_DIR}/control_auth_cookie
      # bitcoincore
      - --HiddenServiceDir
      - /home/nonroot/onion_bitcoincore
      - --HiddenServiceVersion
      - "3"
      - --HiddenServicePort
      - ${BLESK_BITCOINCORE_PORT_P2P} [${BLESK_BITCOINCORE_IPV6}]:${BLESK_BITCOINCORE_PORT_P2P}
      - --HiddenServiceDirGroupReadable
      - "1"
      # electrs
      - --HiddenServiceDir
      - /home/nonroot/onion_electrs
      - --HiddenServiceVersion
      - "3"
      - --HiddenServicePort
      - ${BLESK_ELECTRS_PORT} [${BLESK_ELECTRS_IPV6}]:${BLESK_ELECTRS_PORT}
      - --HiddenServiceDirGroupReadable
      - "1"
      # explorer
      - --HiddenServiceDir
      - /home/nonroot/onion_explorer
      - --HiddenServiceVersion
      - "3"
      - --HiddenServicePort
      - 80 [${BLESK_EXPLORER_IPV6}]:${BLESK_EXPLORER_PORT}
      - --HiddenServiceDirGroupReadable
      - "1"
      # dojo
      - --HiddenServiceDir
      - /home/nonroot/onion_dojo
      - --HiddenServiceVersion
      - "3"
      - --HiddenServicePort
      - 80 [${BLESK_NGINX_IPV6}]:${BLESK_NGINX_PORT}
      - --HiddenServiceDirGroupReadable
      - "1"
      # lnd
      - --HiddenServiceDir
      - /home/nonroot/onion_lnd
      - --HiddenServiceVersion
      - "3"
      - --HiddenServicePort
      - 80 [${BLESK_LND_IPV6}]:${BLESK_LND_PORT_REST}
      - --HiddenServiceDirGroupReadable
      - "1"
    volumes:
      - data-tor:/home/nonroot
      - cookie-tor:${BLESK_TOR_COOKIE_DIR}
    networks:
      internal:
        ipv6_address: ${BLESK_TOR_IPV6}
      external:
  bitcoincore:
    <<: *svc
    container_name: bitcoincore
    image: blesk/bitcoincore
    build:
      context: ./bitcoincore
      args:
        BLESK_BITCOINCORE_VERSION:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_UID:
        BLESK_BITCOINCORE_GID:
        BLESK_BITCOINCORE_HOME:
        BLESK_BITCOINCORE_PORT_RPC:
        BLESK_BITCOINCORE_PORT_P2P:
        BLESK_BITCOINCORE_PORT_ZMQ_BLOCK:
        BLESK_BITCOINCORE_PORT_ZMQ_TX:
        BLESK_TOR_USERNAME:
        BLESK_TOR_GID:
    user: $BLESK_BITCOINCORE_USERNAME
    volumes:
      - data-bitcoincore:${BLESK_BITCOINCORE_HOME}/.bitcoin
      - data-tor:${BLESK_TOR_HOME}:ro
    networks:
      internal:
        ipv6_address: ${BLESK_BITCOINCORE_IPV6}
    depends_on:
      tor:
        condition: service_started
  electrs:
    <<: *svc
    container_name: electrs
    image: blesk/electrs
    build:
      context: ./electrs
      args:
        BLESK_ELECTRS_VERSION:
        BLESK_ELECTRS_USERNAME:
        BLESK_ELECTRS_UID:
        BLESK_ELECTRS_GID:
        BLESK_ELECTRS_HOME:
        BLESK_ELECTRS_PORT:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_GID:
    user: $BLESK_ELECTRS_USERNAME
    volumes:
      - data-electrs:${BLESK_ELECTRS_HOME}
      - data-bitcoincore:${BLESK_ELECTRS_HOME}/.bitcoin:ro
      - type: tmpfs
        target: /etc/electrs
        tmpfs:
          size: 1M
          mode: 0777
    networks:
      internal:
        ipv6_address: ${BLESK_ELECTRS_IPV6}
    depends_on:
      bitcoincore:
        condition: service_started
        restart: true
  explorer:
    <<: *svc
    container_name: explorer
    image: blesk/explorer
    build:
      context: ./explorer
      args:
        BLESK_EXPLORER_VERSION:
        BLESK_EXPLORER_CHECKSUM:
        BLESK_EXPLORER_USERNAME:
        BLESK_EXPLORER_UID:
        BLESK_EXPLORER_GID:
        BLESK_EXPLORER_HOME:
        BLESK_EXPLORER_PORT:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_GID:
    user: $BLESK_EXPLORER_USERNAME
    volumes:
      - data-bitcoincore:${BLESK_EXPLORER_HOME}/.bitcoin:ro
      - type: tmpfs
        target: "${BLESK_EXPLORER_HOME}/cache"
        tmpfs:
          size: 1M
          mode: 0777
      - type: tmpfs
        target: /etc/btc-rpc-explorer
        tmpfs:
          size: 1M
          mode: 0777
    networks:
      internal:
        ipv6_address: ${BLESK_EXPLORER_IPV6}
    depends_on:
      bitcoincore:
        condition: service_started
      electrs:
        condition: service_started
  mariadb:
    <<: *svc
    container_name: mariadb
    image: blesk/mariadb
    build:
      context: ./mariadb
      args:
        BLESK_DOJO_VERSION:
        BLESK_MARIADB_SCRIPTS_CHECKSUM_1:
        BLESK_MARIADB_SCRIPTS_CHECKSUM_2:
        BLESK_MARIADB_VERSION:
    user: mysql
    volumes:
      - data-mariadb:/var/lib/mysql
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 10M
          mode: 0777
      - type: tmpfs
        target: /run/mysqld
        tmpfs:
          size: 1M
          mode: 0777
    networks:
      internal:
        ipv6_address: ${BLESK_MARIADB_IPV6}
  dojo:
    <<: *svc
    container_name: dojo
    image: blesk/dojo
    build:
      context: ./dojo
      args:
        BLESK_DOJO_VERSION:
        BLESK_DOJO_USERNAME:
        BLESK_DOJO_UID:
        BLESK_DOJO_GID:
        BLESK_DOJO_HOME:
        BLESK_DOJO_PORT_API:
        BLESK_DOJO_PORT_PUSHTX:
        BLESK_DOJO_PORT_TRACKER:
        BLESK_TOR_USERNAME:
        BLESK_TOR_GID:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_GID:
    user: $BLESK_DOJO_USERNAME
    volumes:
      - data-tor:${BLESK_TOR_HOME}:ro
      - data-bitcoincore:${BLESK_DOJO_HOME}/.bitcoin:ro
      - type: tmpfs
        target: ${BLESK_DOJO_HOME}/dojo/keys
        tmpfs:
          size: 1M
          mode: 0777
      - type: tmpfs
        target: ${BLESK_DOJO_HOME}/.npm
        tmpfs:
          size: 1M
          mode: 0777
      - type: tmpfs
        target: ${BLESK_DOJO_HOME}/.pm2
        tmpfs:
          size: 1M
          mode: 0777
      - type: tmpfs
        target: ${BLESK_DOJO_LOGS_DIR}
        tmpfs:
          size: 1M
          mode: 0777
    networks:
      internal:
        ipv6_address: ${BLESK_DOJO_IPV6}
    depends_on:
      tor:
        condition: service_started
      bitcoincore:
        condition: service_started
        restart: true
      electrs:
        condition: service_started
      mariadb:
        condition: service_started
        restart: true
  nginx:
    <<: *svc
    container_name: nginx
    image: blesk/nginx
    build:
      context: ./nginx
      args:
        NGINX_ENVSUBST_OUTPUT_DIR:
        NGINX_ENVSUBST_TEMPLATE_DIR:
    user: nginx
    volumes:
      - type: tmpfs
        target: /etc/nginx/sites-enabled
        tmpfs:
          size: 1M
          mode: 0777
      - type: tmpfs
        target: /tmp/
        tmpfs:
          size: 1M
          mode: 0777
    networks:
      internal:
        ipv6_address: ${BLESK_NGINX_IPV6}
  lnd:
    <<: *svc
    container_name: lnd
    image: blesk/lnd
    build:
      context: ./lnd
      args:
        BLESK_LND_VERSION:
        BLESK_LND_SIGNATURES:
        BLESK_LND_USERNAME:
        BLESK_LND_UID:
        BLESK_LND_GID:
        BLESK_LND_HOME:
        BLESK_LND_PORT_P2P:
        BLESK_LND_PORT_RPC:
        BLESK_LND_PORT_REST:
        BLESK_LND_SCB_BACKUP_DIR:
        BLESK_LNDINIT_VERSION:
        BLESK_LNDCONNECT_VERSION:
        BLESK_LNDCONNECT_CHECKSUM:
        BLESK_TOR_USERNAME:
        BLESK_TOR_GID:
        BLESK_BITCOINCORE_USERNAME:
        BLESK_BITCOINCORE_GID:
    user: $BLESK_LND_USERNAME
    volumes:
      - data-lnd:${BLESK_LND_HOME}/.lnd
      - data-tor:${BLESK_TOR_HOME}:ro
      - data-bitcoincore:${BLESK_LND_HOME}/.bitcoin:ro
      - ${BLESK_LND_SCB_BACKUP_DIR}:${BLESK_LND_SCB_BACKUP_DIR}
    networks:
      internal:
        ipv6_address: ${BLESK_LND_IPV6}
    depends_on:
      tor:
        condition: service_started
      bitcoincore:
        condition: service_started
        restart: true

volumes:
  data-tor:
  cookie-tor:
  data-bitcoincore:
  data-electrs:
  data-mariadb:
  data-lnd:

networks:
  external:
    driver: bridge
    driver_opts:
      com.docker.network.enable_ipv6: "true"
      com.docker.network.enable_ipv4: "false"
  internal:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.enable_ipv6: "true"
      com.docker.network.enable_ipv4: "false"
    ipam:
      driver: default
      config:
        - subnet: ${BLESK_NET_INTERNAL_IPV6}
